{% extends "shared/base.html" %}

{% block body %}
<div class="min-h-screen bg-gray-50 dark:bg-slate-900 flex flex-col">
    <!-- Minimal auth navbar -->
    <nav class="w-full bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-b border-gray-100 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="{% url 'home' %}" class="font-heading font-bold text-2xl text-dark dark:text-white">
                    ARTISAN<span class="text-primary">.</span>
                </a>
                <div class="flex items-center gap-4">
                    {% block auth_nav_right %}{% endblock %}
                    <button id="dark-mode-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Auth content -->
    <main class="flex-1 flex items-center justify-center px-6 py-12">
        {% if messages %}
        <div class="fixed top-20 right-4 z-50 space-y-2 max-w-sm">
            {% for message in messages %}
            <div class="px-4 py-3 rounded-xl shadow-lg text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200{% elif message.tags == 'warning' %}bg-yellow-50 text-yellow-700 border border-yellow-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block auth_content %}{% endblock %}
    </main>
</div>
{% endblock %}
