{% extends "employer/base_employer.html" %}
{% block title %}Delete Job{% endblock %}
{% block employer_content %}
<div class="max-w-md mx-auto text-center py-12">
  <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-4">Delete "{{ job.title }}"?</h1>
  <p class="text-slate-500 mb-8">This cannot be undone. All applications will also be removed.</p>
  <form method="post" class="flex gap-4 justify-center">
    {% csrf_token %}
    <button type="submit" class="px-6 py-3 bg-red-600 text-white font-bold rounded-xl">Delete</button>
    <a href="{% url 'employer_job_detail' job.id %}" class="px-6 py-3 border rounded-xl font-bold">Cancel</a>
  </form>
</div>
{% endblock %}
