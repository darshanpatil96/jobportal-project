{% if jobs %}
<section class="mb-10">
  <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">{{ title }} <span class="text-slate-400 font-normal">({{ jobs|length }})</span></h2>
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-hidden">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 uppercase text-[10px] tracking-widest">
        <tr>
          <th class="px-6 py-4">Job</th>
          <th class="px-6 py-4">Status</th>
          <th class="px-6 py-4">Apps</th>
          <th class="px-6 py-4">Posted</th>
          <th class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        {% for job in jobs %}
        <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">
          <td class="px-6 py-4">
            <a href="{% url 'employer_job_detail' job.id %}" class="font-bold text-slate-900 dark:text-white hover:text-indigo-600">{{ job.title }}</a>
            <p class="text-xs text-slate-500">{{ job.location }}</p>
          </td>
          <td class="px-6 py-4"><span class="text-xs font-bold uppercase">{{ job.status }}</span></td>
          <td class="px-6 py-4 font-semibold">{{ job.app_count }}</td>
          <td class="px-6 py-4 text-slate-500">{{ job.posted_at|date:"M d, Y" }}</td>
          <td class="px-6 py-4 text-right space-x-2">
            <a href="{% url 'employer_applications' %}?job={{ job.id }}" class="text-indigo-600 font-semibold text-xs">Applicants</a>
            <a href="{% url 'employer_job_edit' job.id %}" class="text-slate-500 font-semibold text-xs">Edit</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endif %}
